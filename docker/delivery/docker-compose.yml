name: retainpdf

services:
  app:
    image: ${APP_IMAGE:-wxyhgk/retainpdf-app:latest}
    restart: unless-stopped
    env_file:
      - ./docker/app.env
    ports:
      - "${APP_PORT:-41000}:41000"
      - "${APP_SIMPLE_PORT:-42000}:42000"
    volumes:
      - app_data:/data
      - ./docker/auth.local.json:/app/backend/rust_api/auth.local.json:ro
      - ./llm-patch/refusal.py:/app/backend/scripts/services/translation/llm/validation/refusal.py:ro
      - ./llm-patch/errors.py:/app/backend/scripts/services/translation/llm/validation/errors.py:ro
      - ./llm-patch/result_validator.py:/app/backend/scripts/services/translation/llm/result_validator.py:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:41000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  web:
    image: ${WEB_IMAGE:-wxyhgk/retainpdf-web:latest}
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    env_file:
      - ./docker/web.env
    volumes:
      - ./web-patch/constants.js:/usr/share/nginx/html/src/js/constants.js:ro
    ports:
      - "${WEB_PORT:-40001}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

volumes:
  app_data:
