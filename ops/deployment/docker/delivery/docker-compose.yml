name: retainpdf

services:
  app:
    image: ${APP_IMAGE:-wxyhgk/retainpdf-app:latest}
    restart: unless-stopped
    env_file:
      - ./docker/app.env
    environment:
      # LAB-605: 请求未带 workers 时的默认翻译并发（上游默认 4；generic=自建网关/自定义 API）
      - RUST_API_DEFAULT_GENERIC_WORKERS=8
    ports:
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-41000}:41000"
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${APP_SIMPLE_PORT:-42000}:42000"
    volumes:
      - app_data:/data
      - ./docker/auth.local.json:/app/services/api/auth.local.json:ro
      # 2026-10-07 LAB-605: LAB-200 的合批门禁放宽（min 16->4, max 1200->4000 chars）。
      # v4.2.6 的 BatchPolicy 默认值与 v4.2.5 相同，补丁基于 v4.2.6 源文件重打。
      - ./gw2a-patch/control_context.py:/usr/local/lib/python3.11/site-packages/retainpdf_pipeline/translate/llm/shared/control_context.py:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:41000/ready"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  web:
    image: ${WEB_IMAGE:-wxyhgk/retainpdf-web:latest}
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    env_file:
      - ./docker/web.env
    ports:
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-40001}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

volumes:
  app_data:
